name: Temporary cover transfer probe
on:
  push:
    paths:
      - '.github/workflows/aa-cover-transfer-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-image-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify transport can retrieve the actual generated PNG
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 70 -o /tmp/aa-cover-probe.png 'https://at.adobe.com/YRO9jM5LPI4YQwFn'
          file /tmp/aa-cover-probe.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/aa-cover-probe.png')
          assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), 'Received an HTML login/error page instead of the cover PNG'
          print('Verified image transfer bytes:',p.stat().st_size)
          PY
