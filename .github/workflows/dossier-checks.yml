name: Editorial dossier checks
on:
  pull_request:
    paths:
      - 'assets/dossier-editorial.css'
      - '**.html'
      - 'scripts/check-dossiers.mjs'
      - '.github/workflows/dossier-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-dossiers.mjs
