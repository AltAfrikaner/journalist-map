name: Editorial dossier checks
on:
  pull_request:
    paths:
      - 'assets/dossier-editorial.css'
      - 'assets/dossier-batch-10-12.css'
      - 'assets/dossier-batch-13-15.css'
      - 'assets/dossier-batch-16-18.css'
      - 'assets/dossier-19.css'
      - 'assets/dossier-batch-20-22.css'
      - 'assets/dossier-batch-23-25.css'
      - 'assets/dossier-batch-26-28.css'
      - 'assets/dossier-29.css'
      - 'assets/investigation-contrast.css'
      - '**.html'
      - 'scripts/check-dossiers.mjs'
      - 'scripts/audit-investigations.mjs'
      - '.github/workflows/dossier-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-dossiers.mjs
      - run: node scripts/audit-investigations.mjs --enforce-contrast
