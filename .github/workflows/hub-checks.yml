name: Hub smoke checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/hub-premium.css'
      - 'assets/hub-discovery.js'
      - 'assets/hub-departments.css'
      - 'assets/editorial-shell.css'
      - 'assets/editorial-shell.js'
      - 'articles/index.html'
      - 'scripts/check-hub.mjs'
      - '.github/workflows/hub-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check investigation index
        run: node scripts/check-hub.mjs
