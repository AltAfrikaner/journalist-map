name: Story art integrity
on:
  pull_request:
    paths:
      - 'assets/story-art/**'
      - 'assets/site-branding.js'
      - 'assets/story-art.css'
      - 'scripts/check-story-art.mjs'
      - '.github/workflows/story-art-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-story-art.mjs
